name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake \
            pkg-config pkgconf bsdmainutils python3 autoconf-archive
          sudo apt-get install -y libssl-dev libevent-dev libboost-all-dev \
            libsqlite3-dev libdb-dev libdb++-dev
      - name: Build
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/local/share/aclocal
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench --prefix=/opt/rcpu
          make -j$(nproc) 2>&1 | tail -20
