name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 autoconf-archive
          sudo apt-get install -y libssl-dev libevent-dev libboost-all-dev \
            libsqlite3-dev libdb-dev libdb++-dev
      - name: Provide pkg.m4 macro
        run: |
          mkdir -p build-aux/m4
          find /usr -name "pkg.m4" 2>/dev/null | head -1 | xargs -r -I{} cp {} build-aux/m4/pkg.m4
      - name: Build
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench --prefix=/opt/rcpu
          make -j$(nproc) 2>&1 | tail -20
