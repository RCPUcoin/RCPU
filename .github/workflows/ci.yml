name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 autoconf-archive \
            libssl-dev libevent-dev libboost-all-dev \
            libsqlite3-dev libdb-dev libdb++-dev
      - name: Install pkg-config macros
        run: |
          sudo cp build-aux/m4/pkg.m4 /usr/share/aclocal/pkg.m4
          ls -la /usr/share/aclocal/pkg.m4
      - name: Build
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench --prefix=/opt/rcpu
          make -j$(nproc) 2>&1 | tail -30
